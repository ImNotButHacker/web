<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>伝言板</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            border-left: 5px solid #333;
            padding-left: 10px;
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }

        input[type="text"],
        input[type="comment"],
        textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1 id="massagearia">伝言板</h1>
    <p id="massageDisplay">
        伝言はまだありません
    </p>
    <input type="text" id="userNameInput" placeholder="ニックネームを入力してください">
    <input type="text" id="messageInput" placeholder="メッセージを入力してください">
    <button onclick="sendMessage();">送信</button>
    <script>
        function sendMessage() {
            if (userNameInput.value === "" || messageInput.value === "") {
                alert("ニックネームとメッセージを入力してください");
                return;
            } else {
                massageDisplay.innerText = userNameInput.value + ": " + messageInput.value;
            }
        }
    </script>
</body>

</html>
